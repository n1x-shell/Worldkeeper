name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The Active LTS Node.js (.nvmrc); the desktop build refuses one that isn't LTS.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Known security holes in the packages (high or critical).
      - run: npm run audit
      - run: npm run typecheck
      # Oxlint (with type-aware rules); any warning fails.
      - run: npm run lint -- --deny-warnings
      # knip: unused files, exports and packages.
      - run: npm run deadcode
      - run: npm test
      # Both builds: the GM app and the player site (npm run build typechecks first).
      - run: npm run build

  # In a real browser: the first-run wizard both ways, each on an empty data folder (build your own world, and Oros),
  # then a session at the table. The older smoke test needs the archive, which never goes on GitHub, so it stays a
  # local check (docs/DEVELOPMENT.md).
  e2e:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Playwright isn't a project dependency (it's installed where the tests run); its browser comes with it.
      - run: npm install --no-save "playwright@$PLAYWRIGHT_VERSION" && npx playwright install --with-deps chromium
      - name: First run, your own world
        run: |
          PORT=4310 WORLDKEEPER_DATA_DIR="$RUNNER_TEMP/own" NODE_ENV=production npx tsx server/src/index.ts > "$RUNNER_TEMP/own.log" 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:4310/api/health > /dev/null && break; sleep 1; done
          node scripts/e2e-first-run.mjs http://127.0.0.1:4310 own e2e-shots/own
      - name: First run, Oros
        run: |
          PORT=4311 WORLDKEEPER_DATA_DIR="$RUNNER_TEMP/setting" NODE_ENV=production npx tsx server/src/index.ts > "$RUNNER_TEMP/setting.log" 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:4311/api/health > /dev/null && break; sleep 1; done
          node scripts/e2e-first-run.mjs http://127.0.0.1:4311 setting e2e-shots/setting
      # A session at the table: the GM's app and two players' phones together, on a third empty data folder. What
      # players may and may not see is checked in the pages and in everything the table's server answers.
      - name: At the table
        run: |
          PORT=4312 WORLDKEEPER_TABLE_PORT=4322 WORLDKEEPER_NO_UPDATE_CHECK=1 WORLDKEEPER_DATA_DIR="$RUNNER_TEMP/table" NODE_ENV=production npx tsx server/src/index.ts > "$RUNNER_TEMP/table.log" 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:4312/api/health > /dev/null && break; sleep 1; done
          node scripts/e2e-table.mjs http://127.0.0.1:4312 e2e-shots/table
      # Can everyone use it? Forty screens in both themes against the accessibility rules (axe-core, WCAG 2.2 AA), on
      # a tablet held both ways, and with the keyboard alone. On a fourth empty data folder.
      - name: Accessibility
        run: |
          PORT=4313 WORLDKEEPER_TABLE_PORT=4323 WORLDKEEPER_NO_UPDATE_CHECK=1 WORLDKEEPER_DATA_DIR="$RUNNER_TEMP/a11y" NODE_ENV=production npx tsx server/src/index.ts > "$RUNNER_TEMP/a11y.log" 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:4313/api/health > /dev/null && break; sleep 1; done
          node scripts/e2e-a11y.mjs http://127.0.0.1:4313 e2e-shots/a11y
      - name: Server logs
        if: failure()
        run: cat "$RUNNER_TEMP"/*.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-screenshots
          path: e2e-shots
