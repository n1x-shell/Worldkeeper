name: Desktop installers

# Builds the Tauri desktop app on each OS (Tauri does not cross-compile).
# Push a tag such as v0.3.0 (or publish a release that creates one) and the installers are attached to that tag's
# release. Run manually from the Actions tab to build any branch, or give a tag to build it and attach the installers
# to its release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach installers to (for example v0.3.0). Leave empty to build only.'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          # The Active LTS Node.js (.nvmrc); the desktop build refuses one that isn't LTS.
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev file
      - run: npm ci
      # With the update key (the repository secret TAURI_SIGNING_PRIVATE_KEY), each installer the app can update
      # itself with is signed, for "Update and restart" (docs/DESKTOP.md). Without it the build is as it always was.
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run desktop:build -- --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::notice::No update key: building without the files for in-app updates"
            npm run desktop:build
          fi
      # Does what was just built actually work? Each system's app is installed (or run from its bundle), started on
      # an empty data folder, and checked from outside: its server starts, its window loads the app, a record can be
      # written and read back, the rules and the Oros worldbook that ship inside it are there, and closing it stops
      # its server (scripts/desktop-smoke.mjs). A build that fails this is not published.
      - name: Try the app (Linux, the .deb installed and the AppImage)
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          sudo apt-get install -y xvfb
          sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
          xvfb-run -a node scripts/desktop-smoke.mjs /usr/bin/worldkeeper
          xvfb-run -a node scripts/desktop-smoke.mjs "$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)"
      - name: Try the app (macOS, from the .app)
        if: runner.os == 'macOS'
        run: node scripts/desktop-smoke.mjs --find
      - name: Try the app (Windows, installed by the installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          node scripts/desktop-smoke.mjs --find
      - uses: actions/upload-artifact@v7
        with:
          name: worldkeeper-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error

  # One job attaches every platform's installers to the release, after all builds pass.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: source
          sparse-checkout: scripts
      # latest.json tells the app which file is each system's update and carries its signature. The signatures go
      # into it, so the .sig files themselves aren't published.
      - name: Update manifest
        run: |
          if node source/scripts/updater-manifest.mjs installers "${{ inputs.tag || github.ref_name }}" > latest.json; then
            mv latest.json installers/latest.json
          else
            echo "::notice::This release has no in-app update (built without the update key)"
            rm -f latest.json
          fi
          find installers -name '*.sig' -delete
      - name: List installers
        run: find installers -type f -exec ls -lh {} +
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: installers/**/*
          fail_on_unmatched_files: true
