name: Desktop installers

# Builds the Tauri desktop app on each OS (Tauri does not cross-compile).
# Push a tag such as v0.3.0 (or publish a release that creates one) and the installers are attached to that tag's
# release. Run manually from the Actions tab to build any branch, or give a tag to build it and attach the installers
# to its release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach installers to (for example v0.3.0). Leave empty to build only.'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          # The Active LTS Node.js (.nvmrc); the desktop build refuses one that isn't LTS.
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev file
      - run: npm ci
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v7
        with:
          name: worldkeeper-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error

  # One job attaches every platform's installers to the release, after all builds pass.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: List installers
        run: find installers -type f -exec ls -lh {} +
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: installers/**/*
          fail_on_unmatched_files: true
